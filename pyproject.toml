[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t-education-agent"
version = "0.1.0"
description = "Production-ready RAG AI assistant for T-Education programs (NETI-NEXT 2.0 Hackathon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "python-docx>=1.1",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "groq>=0.15",
    "streamlit>=1.40",
    "uvicorn>=0.30",
    "fastapi>=0.115",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
retrieval = [
    "fastembed>=0.4",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
t-edu-ingest = "t_edu_agent.ingestion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
